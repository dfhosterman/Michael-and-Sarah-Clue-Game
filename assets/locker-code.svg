  <rect width="900" height="560" rx="36" fill="#fff8e8"/>
  <rect x="36" y="36" width="828" height="488" rx="28" fill="#f5ecff" stroke="#7d3f8c" stroke-width="8" stroke-dasharray="20 14"/>
  <text x="450" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#5c286a">LOCKER CODE PLACEHOLDER</text>
  <g transform="translate(450 295)">
    <ellipse cx="0" cy="35" rx="125" ry="148" fill="#22252e"/>
    <ellipse cx="0" cy="62" rx="82" ry="105" fill="#ffffff"/>
    <circle cx="-42" cy="-64" r="18" fill="#ffffff"/>
    <circle cx="42" cy="-64" r="18" fill="#ffffff"/>
    <circle cx="-42" cy="-64" r="8" fill="#1f2230"/>
